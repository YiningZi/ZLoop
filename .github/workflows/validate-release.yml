name: Validate and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package and version checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate package and release notes
        run: python -m unittest discover -s tests -p 'test_package.py' -v
      - name: Check current version notes
        run: python tools/release_notes.py --output dist/release-notes.md
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release_notes.py --version "$RELEASE_TAG" --output dist/release-notes.md
      - name: Build installable ZIP
        run: python build_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zloop-installable-package
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  blender:
    name: Blender ${{ matrix.version }} mesh regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ['4.4.3', '5.1.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrender1 libxxf86vm1 libxi6 libxfixes3 libxkbcommon0 libsm6 libgl1
      - name: Download and verify official Blender
        id: blender
        env:
          BLENDER_VERSION: ${{ matrix.version }}
        run: >-
          python3 tools/download_blender.py
          --version "$BLENDER_VERSION"
          --output-dir "$RUNNER_TEMP/blender"
          --github-output "$GITHUB_OUTPUT"
      - name: Test real mesh edits and registration lifecycle
        env:
          BLENDER_EXECUTABLE: ${{ steps.blender.outputs.executable }}
        run: >-
          "$BLENDER_EXECUTABLE" --background --factory-startup --disable-autoexec
          --python-exit-code 1 --python tests/test_connected_blender.py

  release:
    name: Publish versioned installable release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package, blender]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and extract verified version notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 build_release.py
          python3 tools/release_notes.py --version "$RELEASE_TAG" --output dist/release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt
          --verify-tag --title "ZLoop ${RELEASE_TAG#v}"
          --notes-file dist/release-notes.md
